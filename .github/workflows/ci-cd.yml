name: CI/CD - Tests, Docker Hub et Azure

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest tests/unit


  e2e-tests:
    name: E2E tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install E2E dependencies
        run: |
          pip install pytest
          pip install requests

      - name: Build Docker image for E2E
        run: docker build -t my-api:e2e .

      - name: Start Docker container
        run: |
          docker run -d \
            --name my-api-e2e \
            -p 8000:8000 \
            my-api:e2e

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 1
          done

          echo "Application did not start"
          docker logs my-api-e2e
          exit 1

      - name: Run E2E tests
        run: pytest tests/e2e

      - name: Stop container
        if: always()
        run: docker rm -f my-api-e2e


  build-push:
    name: Build & Push Docker Hub
    needs:
      - unit-tests
      - e2e-tests
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


  deploy:
    name: Deploy on Azure VM
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy application on Azure VM
          uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USERNAME }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            docker rm -f khanh_vy || true

            docker run -d \
              --name khanh_vy \
              -p 8031:8000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            sleep 5

            curl -f http://localhost:8031/health

            echo "Deployment successful"